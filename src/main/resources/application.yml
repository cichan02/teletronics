server:
  shutdown: graceful
  servlet:
    context-path: /api/v1/teletronics

spring:
  application:
    name: @pom.name@
  profiles:
    active: @spring.profiles.active@
    default: release
  servlet:
    multipart:
      enabled: true
      max-file-size: -1
      max-request-size: -1
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST}:${MONGO_PORT}/${MONGO_DB}
      auto-index-creation: true

file:
  storage:
    location: ./uploads
  token-download:
    secret: ${DOWNLOAD_TOKEN_SECRET}
    ttl: PT15M

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
#Dev environment
spring:
  config:
    activate:
      on-profile: dev
    import: dev.env[.properties]

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    enabled: true
    path: /api-docs

logging:
  file:
    path: logs
    name: ${logging.file.path}/${spring.application.name}.log

---
#Release environment
server:
  port: 56789

spring:
  config:
    activate:
      on-profile: release

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
