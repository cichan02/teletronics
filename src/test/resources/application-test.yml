# Test Profile Configuration for Teletronics

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.7

spring:
  application:
    name: Teletronics test project

  # MongoDB Configuration for Testing (Embedded MongoDB)
  data:
    mongodb:
      database: teletronics-test
      port: 0

  # Disable banner for cleaner test output
  main:
    banner-mode: off

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Server Configuration
server:
  port: 8080

# File Storage Configuration
file:
  storage:
    location: ./test-uploads

# Logging Configuration
logging:
  level:
    root: INFO
    by.piskunou.teletronics: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.web: DEBUG
